
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020210;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla de bienvenida con el corazón */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020210;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        .heart-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 80px;
            animation: pulse 1.5s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 217, 102, 0.6));
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .welcome-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ffd966;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 20px;
        }

        /* Contenido principal (galaxia / dedicatoria) */
        #main-content {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #ffd966;
            margin-bottom: 10px;
        }

        p {
            color: #b0c4de;
            font-size: 1.1rem;
        }

        /* Reproductor visible en la esquina para evitar bloqueos del navegador */
        #youtube-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(2, 2, 16, 0.85);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 217, 102, 0.4);
            backdrop-filter: blur(5px);
        }

        #youtube-container iframe {
            border: none;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Pantalla de bienvenida -->
    <div id="welcome-screen">
        <button class="heart-btn" id="startBtn">💛</button>
        <div class="welcome-text">Toca el corazón para comenzar</div>
    </div>

    <!-- Contenido Principal -->
    <div id="main-content">
        <h1>The Scientist</h1>
        <p>Volviendo al inicio...</p>
    </div>

    <!-- Reproductor de YouTube (visible y funcional para celulares) -->
    <div id="youtube-container">
        <iframe id="ytAudio" width="180" height="100" src="" title="audio" allow="autoplay"></iframe>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', () => {
            const iframe = document.getElementById('ytAudio');
            // Asigna el enlace en formato embed con autoplay y bucle
            iframe.src = "https://www.youtube.com/embed/mzTew3e0Ygk?autoplay=1&loop=1&playlist=mzTew3e0Ygk";

            // Oculta la pantalla de bienvenida con animación suave
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 1000);
        });
    </script>

</body>
</html>
